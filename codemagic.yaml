workflows:
  kervix-android-test:
    name: KERVIX Android Test APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Configure Android SDK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Verify KERVIX Android project
        script: |
          set -e
          echo "=== KERVIX project root ==="
          pwd
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew
          chmod +x gradlew
          echo "Gradle project detected in repository root"
      - name: Build KERVIX debug APK
        script: |
          set -e
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace
      - name: Verify APK output
        script: |
          set -e
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
    artifacts:
      - app/build/outputs/apk/**/*.apk
