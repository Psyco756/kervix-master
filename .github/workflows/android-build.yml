name: KERVIX Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KERVIX
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract KERVIX Android project
        shell: bash
        run: |
          set -e

          echo "=== KERVIX repository ==="
          pwd
          ls -la

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname '*KERVIX*MASTER*ANDROID*.zip' -o -iname '*.zip' \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: KERVIX Android ZIP not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p android-source
          unzip -q "$ZIP_FILE" -d android-source

          echo "=== Extracted files ==="
          find android-source -maxdepth 4 -type f | head -200

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find android-source -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the KERVIX Android ZIP"
            echo "Searching for Gradle files..."
            find android-source -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) \
              -print
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$GRADLEW")

          echo "KERVIX Android project found at:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=== KERVIX Android project ==="
          pwd
          echo

          echo "=== Project files ==="
          ls -la
          echo

          test -f gradlew

          if [ -f settings.gradle ]; then
            echo "OK: settings.gradle"
          elif [ -f settings.gradle.kts ]; then
            echo "OK: settings.gradle.kts"
          else
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          if [ -d app ]; then
            echo "OK: app directory"
          else
            echo "ERROR: app directory missing"
            exit 1
          fi

          chmod +x gradlew

      - name: Build KERVIX debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=== Building KERVIX APK ==="

          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== APK files ==="

          find "$PROJECT_ROOT" \
            -type f \
            -name '*.apk' \
            -print

          APK=$(find "$PROJECT_ROOT" \
            -type f \
            -name '*.apk' \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      - name: Upload KERVIX APK
        uses: actions/upload-artifact@v4
        with:
          name: KERVIX-Android-Debug
          path: |
            ${{ env.PROJECT_ROOT }}/**/*.apk
